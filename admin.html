<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Studio-News bearbeiten</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="content-site.css?v=9"></head><body class="admin-page"><main class="admin-card"><p class="eyebrow">Tattoos to the Max</p><h1>Studio-News</h1><p>Nur für das Studio-Team. Anmeldung und Speichern laufen direkt über den geschützten Server.</p><form id="login-form"><label>Benutzername<input name="user" autocomplete="username" required></label><label>Passwort<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-dark" type="submit">Anmelden</button></form><form id="news-form" hidden><label>Überschrift<input name="title" required maxlength="120"></label><label>Text<textarea name="text" rows="6" required maxlength="800"></textarea></label><label>Link (optional)<input name="link" type="url" placeholder="https://..."></label><label>Button-Beschriftung (optional)<input name="button" maxlength="40" placeholder="Mehr erfahren"></label><div class="admin-actions"><button class="button button-dark" type="submit">Veröffentlichen</button></div><p id="status" role="status"></p></form></main><script src="admin.js"></script></body></html>
