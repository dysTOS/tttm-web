<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Studio-News bearbeiten</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="content-site.css?v=9">
</head>
<body class="admin-page">
  <main class="admin-card">
    <p class="eyebrow">Tattoos to the Max</p>
    <h1>Studio-News</h1>
    <p>Nur für das Studio-Team. Hier könnt ihr eine aktuelle Meldung auf der deutschen und englischen Website veröffentlichen oder ausblenden.</p>

    <form id="login-form">
      <label>Benutzername<input name="user" autocomplete="username" required></label>
      <label>Passwort<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button button-dark" type="submit">Anmelden</button>
    </form>

    <form id="news-form" hidden>
      <fieldset>
        <legend>Deutsch</legend>
        <label>Überschrift<input name="de-title" required maxlength="120"></label>
        <label>Text<textarea name="de-text" rows="6" required maxlength="800"></textarea></label>
        <label>Link (optional)<input name="de-link" type="url" maxlength="2048" placeholder="https://..."></label>
        <label>Button-Beschriftung (optional)<input name="de-button" maxlength="40" placeholder="Mehr erfahren"></label>
      </fieldset>

      <fieldset>
        <legend>Englisch (optional)</legend>
        <p>Bleiben Überschrift und Text leer, wird auf der englischen Seite keine Meldung angezeigt.</p>
        <label>Headline<input name="en-title" maxlength="120"></label>
        <label>Text<textarea name="en-text" rows="6" maxlength="800"></textarea></label>
        <label>Link (optional)<input name="en-link" type="url" maxlength="2048" placeholder="https://..."></label>
        <label>Button label (optional)<input name="en-button" maxlength="40" placeholder="Learn more"></label>
      </fieldset>

      <div class="admin-actions">
        <button class="button button-dark" id="publish-news" type="submit">Veröffentlichen</button>
        <button class="button button-dark" id="disable-news" type="button">Meldung ausblenden</button>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="admin.js"></script>
</body>
</html>
